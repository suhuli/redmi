name: Build Kernel Xiaomi

on:
  workflow_dispatch:
    inputs:
      FILE:
        type: choice
        description: "Device config"
        required: true
        default: redmi_note11pro_pissarro_r
        options:
          - redmi_note11pro_pissarro_r
          - redmi_note11pro_pissarro_s
          - redmi_10x5g_atom_r
      MANAGER_SOURCE:
        type: choice
        description: "Root manager source"
        required: true
        default: RESUKISU
        options:
          - RESUKISU
          - RESUKISU_SPOOF
      KSU_META:
        type: string
        description: "ReSukiSU branch/custom tag/commit hash"
        required: false
        default: "main//"
      BUILD_TIME:
        type: string
        description: "Custom build timestamp, or F for current UTC time"
        required: false
        default: "F"
      SUFFIX:
        type: string
        description: "Custom zip suffix"
        required: false
        default: ""
      FAST_BUILD:
        type: boolean
        description: "Keep compatibility flags and use ccache"
        required: true
        default: true
      ENABLE_KPM:
        type: boolean
        description: "Enable ReSukiSU KPM support"
        required: true
        default: false
      ENABLE_SUSFS:
        type: boolean
        description: "Enable SUSFS inline hook support"
        required: true
        default: false
      SUSFS_META:
        type: string
        description: "SUSFS branch/custom tag/commit hash, or -1 to disable"
        required: false
        default: "kernel-4.14//"
      ZERO_WIDTH_FIX:
        type: boolean
        description: "Apply SUSFS zero-width/No_5uS compatibility fix"
        required: true
        default: false

jobs:
  build:
    name: Build ${{ github.event.inputs.FILE }} ${{ github.event.inputs.SUFFIX }}
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_MAXSIZE: 8G

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - name: Install Dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: git curl ccache build-essential bc bison flex libssl-dev libelf-dev libncurses-dev lz4 zstd zip unzip python3 python3-lib2to3 python-is-python3 pahole
          execute_install_scripts: true

      - name: Resolve Device Config
        id: device
        env:
          FILE: ${{ github.event.inputs.FILE }}
        run: |
          set -euo pipefail
          case "$FILE" in
            redmi_note11pro_pissarro_r)
              echo "device_name=Redmi Note 11 Pro pissarro Android R" >> "$GITHUB_OUTPUT"
              echo "source_branch=pissarro-r-oss" >> "$GITHUB_OUTPUT"
              echo "defconfig=pissarro_user_defconfig" >> "$GITHUB_OUTPUT"
              echo "build_target=Image.gz-dtb" >> "$GITHUB_OUTPUT"
              echo "kernel_image=arch/arm64/boot/Image.gz-dtb" >> "$GITHUB_OUTPUT"
              echo "android_short=11" >> "$GITHUB_OUTPUT"
              ;;
            redmi_note11pro_pissarro_s)
              echo "device_name=Redmi Note 11 Pro pissarro Android S" >> "$GITHUB_OUTPUT"
              echo "source_branch=pissarro-s-oss" >> "$GITHUB_OUTPUT"
              echo "defconfig=pissarro_user_defconfig" >> "$GITHUB_OUTPUT"
              echo "build_target=Image.gz-dtb" >> "$GITHUB_OUTPUT"
              echo "kernel_image=arch/arm64/boot/Image.gz-dtb" >> "$GITHUB_OUTPUT"
              echo "android_short=12" >> "$GITHUB_OUTPUT"
              ;;
            redmi_10x5g_atom_r)
              echo "device_name=Redmi 10X 5G atom Android R" >> "$GITHUB_OUTPUT"
              echo "source_branch=bomb-q-oss" >> "$GITHUB_OUTPUT"
              echo "defconfig=atom_user_defconfig" >> "$GITHUB_OUTPUT"
              echo "build_target=Image.gz-dtb" >> "$GITHUB_OUTPUT"
              echo "kernel_image=arch/arm64/boot/Image.gz-dtb" >> "$GITHUB_OUTPUT"
              echo "android_short=11" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown FILE: $FILE" >&2
              exit 2
              ;;
          esac

      - name: Resolve Manager Source
        id: manager
        run: |
          set -euo pipefail
          case "${{ github.event.inputs.MANAGER_SOURCE }}" in
            RESUKISU)
              echo "repo=ReSukiSU/ReSukiSU" >> "$GITHUB_OUTPUT"
              echo "branch=main" >> "$GITHUB_OUTPUT"
              echo "artifact=Manager-release" >> "$GITHUB_OUTPUT"
              ;;
            RESUKISU_SPOOF)
              echo "repo=ReSukiSU/ReSukiSU" >> "$GITHUB_OUTPUT"
              echo "branch=main" >> "$GITHUB_OUTPUT"
              echo "artifact=Spoofed-Manager-release" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Prepare Workspace
        run: |
          set -euo pipefail
          mkdir -p kernel_workspace
          echo "CCACHE_DIR=$HOME/.ccache_${{ github.event.inputs.FILE }}" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.ccache_${{ github.event.inputs.FILE }}"

      - name: Restore Ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache_${{ github.event.inputs.FILE }}
          key: ccache-${{ github.event.inputs.FILE }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ github.event.inputs.FILE }}-

      - name: Clone Xiaomi Kernel Source
        run: |
          set -euo pipefail
          cd kernel_workspace
          git clone --depth=1 --branch "${{ steps.device.outputs.source_branch }}" \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel

      - name: Fix MTK Python2 DCT Scripts
        run: |
          set -euo pipefail
          cd kernel_workspace/kernel
          if [[ -d tools/dct ]]; then
            python3 -m lib2to3 -w tools/dct
            python3 -c "from pathlib import Path; p=Path('tools/dct/DrvGen.py'); data=p.read_text() if p.exists() else ''; compat='\nimport builtins\nbuiltins.cmp = lambda a, b: (a > b) - (a < b)\n\n'; p.write_text(data.replace('sys.dont_write_bytecode = True\n', 'sys.dont_write_bytecode = True\n' + compat, 1)) if p.exists() and 'builtins.cmp' not in data else None"
            find tools/dct -name '*.py' -print0 | xargs -0 sed -i 's/configparser.ConfigParser(allow_no_value=True)/configparser.ConfigParser(allow_no_value=True, strict=False)/g'
            find tools/dct -name '*.py' -print0 | xargs -0 sed -i 's/string\.atoi/int/g'
            sed -i 's/list(map.items())/map.items()/g' tools/dct/data/EintData.py
            sed -i 's/list(EintData\._mode_map\.keys())/EintData._mode_map.keys()/g' tools/dct/data/EintData.py
          fi

      - name: Clone Toolchains
        run: |
          set -euo pipefail
          cd kernel_workspace
          git clone --depth=1 --filter=blob:none --sparse --branch android11-mainline-release \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang
          git -C clang sparse-checkout set clang-r383902

          git clone --depth=1 --filter=blob:none --sparse --branch android11-mainline-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64
          git -C gcc64 sparse-checkout set bin lib libexec aarch64-linux-android

          git clone --depth=1 --filter=blob:none --sparse --branch android11-mainline-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc32
          git -C gcc32 sparse-checkout set bin lib libexec arm-linux-androideabi

      - name: Add ReSukiSU
        run: |
          set -euo pipefail
          cd kernel_workspace/kernel
          KSU_META="${{ github.event.inputs.KSU_META }}"
          if [[ "$(grep -o '/' <<< "$KSU_META" | wc -l)" -lt 2 ]]; then
            echo "KSU_META format must be: branch/custom_tag/commit_hash" >&2
            exit 10
          fi
          IFS='/' read -r KSU_BRANCH CUSTOM_TAG MANUAL_HASH <<< "$KSU_META"
          [[ -n "$KSU_BRANCH" ]] || KSU_BRANCH="main"

          curl -LSs "https://raw.githubusercontent.com/${{ steps.manager.outputs.repo }}/${{ steps.manager.outputs.branch }}/kernel/setup.sh" | bash -s "$KSU_BRANCH"

          cd KernelSU
          if [[ -n "$MANUAL_HASH" ]]; then
            git fetch origin "$KSU_BRANCH" --depth=80
            git checkout "$MANUAL_HASH"
          fi
          KSU_VERSION=$(git rev-list --count HEAD)
          if [[ -n "$CUSTOM_TAG" ]]; then
            KSU_VERSION="${KSU_VERSION}-${CUSTOM_TAG}"
          fi
          echo "KSU_VERSION=$KSU_VERSION" >> "$GITHUB_ENV"

      - name: Apply SUSFS Patches
        if: ${{ github.event.inputs.ENABLE_SUSFS == 'true' && github.event.inputs.SUSFS_META != '-1' }}
        run: |
          set -euo pipefail
          cd kernel_workspace

          SUSFS_META="${{ github.event.inputs.SUSFS_META }}"
          if [[ "$(grep -o '/' <<< "$SUSFS_META" | wc -l)" -lt 2 ]]; then
            echo "SUSFS_META format must be: branch/custom_tag/commit_hash" >&2
            exit 11
          fi
          IFS='/' read -r SUSFS_BRANCH SUSFS_TAG SUSFS_HASH <<< "$SUSFS_META"
          [[ -n "$SUSFS_BRANCH" ]] || SUSFS_BRANCH="kernel-4.14"

          git clone --depth=1 --branch "$SUSFS_BRANCH" https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
          cd susfs4ksu
          if [[ -n "$SUSFS_HASH" ]]; then
            git fetch origin "$SUSFS_BRANCH" --depth=80
            git checkout "$SUSFS_HASH"
          fi
          cd ..

          cp susfs4ksu/kernel_patches/fs/* kernel/fs/
          cp susfs4ksu/kernel_patches/include/linux/* kernel/include/linux/
          cd kernel
          patch -p1 --forward < ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.14.patch || true
          rm -f fs/dcache.c.rej fs/notify/fdinfo.c.rej fs/readdir.c.rej

          python3 - <<'PY'
          from pathlib import Path

          def insert_after(path, anchor, text):
              p = Path(path)
              data = p.read_text()
              if text in data:
                  return
              if anchor not in data:
                  raise SystemExit(f"missing SUSFS anchor in {path}:\n{anchor}")
              p.write_text(data.replace(anchor, anchor + text, 1))

          def replace_once(path, old, new):
              p = Path(path)
              data = p.read_text()
              if new in data:
                  return
              if old not in data:
                  raise SystemExit(f"missing SUSFS anchor in {path}:\n{old}")
              p.write_text(data.replace(old, new, 1))

          insert_after(
              "include/linux/susfs_def.h",
              "#define CMD_SUSFS_SUS_SU 0x60000\n",
              "\n#ifndef SUSFS_MAGIC\n#define SUSFS_MAGIC 0xFAFAFAFA\n#endif\n",
          )
          insert_after(
              "fs/dcache.c",
              "#include <linux/list_lru.h>\n",
              "#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n#include <linux/susfs_def.h>\n#endif\n",
          )
          insert_after(
              "fs/notify/fdinfo.c",
              "#include <linux/exportfs.h>\n",
              "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n#include <linux/susfs_def.h>\n#endif\n",
          )
          replace_once(
              "fs/notify/fdinfo.c",
              "static void show_fdinfo(struct seq_file *m, struct file *f,\n"
              "\t\t\tvoid (*show)(struct seq_file *m,\n"
              "\t\t\t\t     struct fsnotify_mark *mark))\n",
              "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
              "static void show_fdinfo(struct seq_file *m, struct file *f,\n"
              "\t\t\tvoid (*show)(struct seq_file *m,\n"
              "\t\t\t\t     struct fsnotify_mark *mark,\n"
              "\t\t\t\t     struct file *file))\n"
              "#else\n"
              "static void show_fdinfo(struct seq_file *m, struct file *f,\n"
              "\t\t\tvoid (*show)(struct seq_file *m,\n"
              "\t\t\t\t     struct fsnotify_mark *mark))\n"
              "#endif\n",
          )
          replace_once(
              "fs/notify/fdinfo.c",
              "\tlist_for_each_entry(mark, &group->marks_list, g_list) {\n"
              "\t\tshow(m, mark);\n",
              "\tlist_for_each_entry(mark, &group->marks_list, g_list) {\n"
              "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
              "\t\tshow(m, mark, f);\n"
              "#else\n"
              "\t\tshow(m, mark);\n"
              "#endif\n",
          )
          replace_once(
              "fs/notify/fdinfo.c",
              "static void inotify_fdinfo(struct seq_file *m, struct fsnotify_mark *mark)\n",
              "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
              "static void inotify_fdinfo(struct seq_file *m, struct fsnotify_mark *mark, struct file *file)\n"
              "#else\n"
              "static void inotify_fdinfo(struct seq_file *m, struct fsnotify_mark *mark)\n"
              "#endif\n",
          )
          replace_once(
              "fs/notify/fdinfo.c",
              "\tinode = igrab(mark->connector->inode);\n"
              "\tif (inode) {\n",
              "\tinode = igrab(mark->connector->inode);\n"
              "\tif (inode) {\n"
              "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
              "\t\tif (likely(current->susfs_task_state & TASK_STRUCT_NON_ROOT_USER_APP_PROC) &&\n"
              "\t\t\t\tunlikely(inode->i_state & INODE_STATE_SUS_KSTAT)) {\n"
              "\t\t\tstruct path path;\n"
              "\t\t\tchar *pathname = kmalloc(PAGE_SIZE, GFP_KERNEL);\n"
              "\t\t\tchar *dpath;\n"
              "\t\t\tif (!pathname)\n"
              "\t\t\t\tgoto out_seq_printf;\n"
              "\t\t\tdpath = d_path(&file->f_path, pathname, PAGE_SIZE);\n"
              "\t\t\tif (IS_ERR(dpath))\n"
              "\t\t\t\tgoto out_free_pathname;\n"
              "\t\t\tif (kern_path(dpath, 0, &path))\n"
              "\t\t\t\tgoto out_free_pathname;\n"
              "\t\t\tseq_printf(m, \"inotify wd:%x ino:%lx sdev:%x mask:%x ignored_mask:0 \",\n"
              "\t\t\t\t   inode_mark->wd, path.dentry->d_inode->i_ino,\n"
              "\t\t\t\t   path.dentry->d_inode->i_sb->s_dev, (mark->mask & IN_ALL_EVENTS));\n"
              "\t\t\tshow_mark_fhandle(m, path.dentry->d_inode);\n"
              "\t\t\tseq_putc(m, '\\n');\n"
              "\t\t\tiput(inode);\n"
              "\t\t\tpath_put(&path);\n"
              "\t\t\tkfree(pathname);\n"
              "\t\t\treturn;\n"
              "out_free_pathname:\n"
              "\t\t\tkfree(pathname);\n"
              "out_seq_printf:\n"
              "\t\t\tseq_printf(m, \"inotify wd:%x ino:%lx sdev:%x mask:%x ignored_mask:0 \",\n"
              "\t\t\t\t   inode_mark->wd, 0UL, 0, (mark->mask & IN_ALL_EVENTS));\n"
              "\t\t\tseq_putc(m, '\\n');\n"
              "\t\t\tiput(inode);\n"
              "\t\t\treturn;\n"
              "\t\t}\n"
              "#endif\n",
          )

          insert_after(
              "fs/readdir.c",
              "#include <linux/uaccess.h>\n",
              "#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n#include <linux/susfs_def.h>\nextern int susfs_sus_ino_for_filldir64(unsigned long ino);\n#endif\n",
          )
          for anchor in [
              "\tbuf->error = verify_dirent_name(name, namlen);\n",
              "\tbuf->error = -EINVAL;\t/* only used if we fail.. */\n",
          ]:
              insert_after(
                  "fs/readdir.c",
                  anchor,
                  "#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
                  "\tif (likely(current->susfs_task_state & TASK_STRUCT_NON_ROOT_USER_APP_PROC) && susfs_sus_ino_for_filldir64(ino)) {\n"
                  "\t\treturn 0;\n"
                  "\t}\n"
                  "#endif\n",
              )
          PY

          if find fs -name '*.rej' -print -quit | grep -q .; then
            find fs -name '*.rej' -print
            exit 12
          fi

      - name: Apply SUSFS Zero Width Fix
        if: ${{ github.event.inputs.ENABLE_SUSFS == 'true' && github.event.inputs.ZERO_WIDTH_FIX == 'true' && github.event.inputs.SUSFS_META != '-1' }}
        run: |
          set -euo pipefail
          cd kernel_workspace/kernel

          python3 - <<'PY'
          from pathlib import Path

          def replace_if_found(path, old, new):
              p = Path(path)
              data = p.read_text()
              if new in data:
                  return
              if old not in data:
                  raise SystemExit(f"missing zero-width fix anchor in {path}")
              p.write_text(data.replace(old, new, 1))

          replace_if_found(
              "fs/dcache.c",
              "if (dentry->d_inode && unlikely(dentry->d_inode->i_state & INODE_STATE_SUS_PATH) && likely(current->susfs_task_state & TASK_STRUCT_NON_ROOT_USER_APP_PROC)) {\n"
              "\t\t\t\tcontinue;\n"
              "\t\t\t}",
              "if (dentry->d_inode && unlikely(dentry->d_inode->i_state & INODE_STATE_SUS_PATH) && likely(current->susfs_task_state & TASK_STRUCT_NON_ROOT_USER_APP_PROC)) {\n"
              "\t\t\t\treturn NULL;\n"
              "\t\t\t}",
          )
          replace_if_found(
              "fs/dcache.c",
              "if (dentry->d_inode && unlikely(dentry->d_inode->i_state & INODE_STATE_SUS_PATH) && likely(current->susfs_task_state & TASK_STRUCT_NON_ROOT_USER_APP_PROC)) {\n"
              "\t\t\tcontinue;\n"
              "\t\t}",
              "if (dentry->d_inode && unlikely(dentry->d_inode->i_state & INODE_STATE_SUS_PATH) && likely(current->susfs_task_state & TASK_STRUCT_NON_ROOT_USER_APP_PROC)) {\n"
              "\t\t\treturn NULL;\n"
              "\t\t}",
          )
          p = Path("fs/susfs.c")
          data = p.read_text()
          old = "return (likely(susfs_is_current_proc_umounted()) &&\n\t\tunlikely(current_uid().val != i_uid));"
          new = "return (likely(susfs_is_current_proc_umounted()) &&\n\t\tunlikely(current_uid().val != i_uid) && unlikely(current_uid().val != 0));"
          if old in data and new not in data:
              p.write_text(data.replace(old, new, 1))
          PY

      - name: Apply ReSukiSU Manual Hooks
        run: |
          set -euo pipefail
          cd kernel_workspace/kernel

          python3 - <<'PY'
          from pathlib import Path

          def hook(body):
              return "#if defined(CONFIG_KSU_MANUAL_HOOK) || defined(CONFIG_KSU_SUSFS)\n" + body + "#endif\n"

          def manual_hook(body):
              return "#ifdef CONFIG_KSU_MANUAL_HOOK\n" + body + "#endif\n"

          def patch(path, replacements):
              p = Path(path)
              data = p.read_text()
              for old, new in replacements:
                  if new in data:
                      continue
                  if old not in data:
                      raise SystemExit(f"missing patch anchor in {path}:\n{old}")
                  data = data.replace(old, new, 1)
              p.write_text(data)

          patch("fs/exec.c", [
              (
                  "int do_execve(struct filename *filename,\n"
                  "\tconst char __user *const __user *__argv,\n"
                  "\tconst char __user *const __user *__envp)\n",
                  hook(
                  "__attribute__((hot))\n"
                  "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n"
                  "\t\t\t\tvoid *argv, void *envp, int *flags);\n"
                  ) + "\n"
                  "int do_execve(struct filename *filename,\n"
                  "\tconst char __user *const __user *__argv,\n"
                  "\tconst char __user *const __user *__envp)\n"
              ),
              (
                  "\tstruct user_arg_ptr argv = { .ptr.native = __argv };\n"
                  "\tstruct user_arg_ptr envp = { .ptr.native = __envp };\n"
                  "\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);\n",
                  "\tstruct user_arg_ptr argv = { .ptr.native = __argv };\n"
                  "\tstruct user_arg_ptr envp = { .ptr.native = __envp };\n" +
                  hook(
                  "\tint ksu_fd = AT_FDCWD;\n"
                  "\tint ksu_flags = 0;\n"
                  "\tksu_handle_execveat(&ksu_fd, &filename, &argv, &envp, &ksu_flags);\n"
                  "\treturn do_execveat_common(ksu_fd, filename, argv, envp, ksu_flags);\n"
                  ) +
                  "\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);\n"
              ),
              (
                  "\tstruct user_arg_ptr argv = { .ptr.native = __argv };\n"
                  "\tstruct user_arg_ptr envp = { .ptr.native = __envp };\n\n"
                  "\treturn do_execveat_common(fd, filename, argv, envp, flags);\n",
                  "\tstruct user_arg_ptr argv = { .ptr.native = __argv };\n"
                  "\tstruct user_arg_ptr envp = { .ptr.native = __envp };\n\n" +
                  hook(
                  "\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n"
                  ) +
                  "\treturn do_execveat_common(fd, filename, argv, envp, flags);\n"
              ),
              (
                  "\tstruct user_arg_ptr envp = {\n"
                  "\t\t.is_compat = true,\n"
                  "\t\t.ptr.compat = __envp,\n"
                  "\t};\n"
                  "\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);\n",
                  "\tstruct user_arg_ptr envp = {\n"
                  "\t\t.is_compat = true,\n"
                  "\t\t.ptr.compat = __envp,\n"
                  "\t};\n" +
                  hook(
                  "\tint ksu_fd = AT_FDCWD;\n"
                  "\tint ksu_flags = 0;\n"
                  "\tksu_handle_execveat(&ksu_fd, &filename, &argv, &envp, &ksu_flags);\n"
                  "\treturn do_execveat_common(ksu_fd, filename, argv, envp, ksu_flags);\n"
                  ) +
                  "\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);\n"
              ),
              (
                  "\tstruct user_arg_ptr envp = {\n"
                  "\t\t.is_compat = true,\n"
                  "\t\t.ptr.compat = __envp,\n"
                  "\t};\n"
                  "\treturn do_execveat_common(fd, filename, argv, envp, flags);\n",
                  "\tstruct user_arg_ptr envp = {\n"
                  "\t\t.is_compat = true,\n"
                  "\t\t.ptr.compat = __envp,\n"
                  "\t};\n" +
                  hook(
                  "\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n"
                  ) +
                  "\treturn do_execveat_common(fd, filename, argv, envp, flags);\n"
              ),
          ])

          patch("fs/open.c", [
              (
                  "/*\n"
                  " * access() needs to use the real uid/gid, not the effective uid/gid.\n",
                  hook(
                  "__attribute__((hot))\n"
                  "extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n"
                  "\t\t\t\tint *mode, int *flags);\n"
                  ) + "\n"
                  "/*\n"
