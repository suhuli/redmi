name: Build Kernel Xiaomi

on:
  workflow_dispatch:
    inputs:
      FILE:
        type: choice
        description: "Device config"
        required: true
        default: redmi_note11pro_pissarro_r
        options:
          - redmi_note11pro_pissarro_r
          - redmi_note11pro_pissarro_s
      MANAGER_SOURCE:
        type: choice
        description: "Root manager source"
        required: true
        default: RESUKISU
        options:
          - RESUKISU
          - RESUKISU_SPOOF
      KSU_META:
        type: string
        description: "ReSukiSU branch/custom tag/commit hash"
        required: false
        default: "main//"
      BUILD_TIME:
        type: string
        description: "Custom build timestamp, or F for current UTC time"
        required: false
        default: "F"
      SUFFIX:
        type: string
        description: "Custom zip suffix"
        required: false
        default: ""
      FAST_BUILD:
        type: boolean
        description: "Keep compatibility flags and use ccache"
        required: true
        default: true

jobs:
  build:
    name: Build ${{ github.event.inputs.FILE }} ${{ github.event.inputs.SUFFIX }}
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_MAXSIZE: 8G

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - name: Install Dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: git curl ccache build-essential bc bison flex libssl-dev libelf-dev libncurses-dev lz4 zstd zip unzip python3 python-is-python3 pahole
          execute_install_scripts: true

      - name: Resolve Device Config
        id: device
        env:
          FILE: ${{ github.event.inputs.FILE }}
        run: |
          set -euo pipefail
          case "$FILE" in
            redmi_note11pro_pissarro_r)
              echo "device_name=Redmi Note 11 Pro pissarro Android R" >> "$GITHUB_OUTPUT"
              echo "source_branch=pissarro-r-oss" >> "$GITHUB_OUTPUT"
              echo "defconfig=pissarro_user_defconfig" >> "$GITHUB_OUTPUT"
              echo "kernel_image=arch/arm64/boot/Image.gz-dtb" >> "$GITHUB_OUTPUT"
              echo "android_short=11" >> "$GITHUB_OUTPUT"
              ;;
            redmi_note11pro_pissarro_s)
              echo "device_name=Redmi Note 11 Pro pissarro Android S" >> "$GITHUB_OUTPUT"
              echo "source_branch=pissarro-s-oss" >> "$GITHUB_OUTPUT"
              echo "defconfig=pissarro_user_defconfig" >> "$GITHUB_OUTPUT"
              echo "kernel_image=arch/arm64/boot/Image.gz-dtb" >> "$GITHUB_OUTPUT"
              echo "android_short=12" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown FILE: $FILE" >&2
              exit 2
              ;;
          esac

      - name: Resolve Manager Source
        id: manager
        run: |
          set -euo pipefail
          case "${{ github.event.inputs.MANAGER_SOURCE }}" in
            RESUKISU)
              echo "repo=ReSukiSU/ReSukiSU" >> "$GITHUB_OUTPUT"
              echo "branch=main" >> "$GITHUB_OUTPUT"
              echo "artifact=Manager-release" >> "$GITHUB_OUTPUT"
              ;;
            RESUKISU_SPOOF)
              echo "repo=ReSukiSU/ReSukiSU" >> "$GITHUB_OUTPUT"
              echo "branch=main" >> "$GITHUB_OUTPUT"
              echo "artifact=Spoofed-Manager-release" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Prepare Workspace
        run: |
          set -euo pipefail
          mkdir -p kernel_workspace
          echo "CCACHE_DIR=$HOME/.ccache_${{ github.event.inputs.FILE }}" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.ccache_${{ github.event.inputs.FILE }}"

      - name: Restore Ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache_${{ github.event.inputs.FILE }}
          key: ccache-${{ github.event.inputs.FILE }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ github.event.inputs.FILE }}-

      - name: Clone Xiaomi Kernel Source
        run: |
          set -euo pipefail
          cd kernel_workspace
          git clone --depth=1 --branch "${{ steps.device.outputs.source_branch }}" \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel

      - name: Clone Toolchains
        run: |
          set -euo pipefail
          cd kernel_workspace
          git clone --depth=1 --filter=blob:none --sparse --branch android11-mainline-release \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang
          git -C clang sparse-checkout set clang-r383902

          git clone --depth=1 --filter=blob:none --sparse --branch android11-mainline-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64
          git -C gcc64 sparse-checkout set bin lib libexec aarch64-linux-android

          git clone --depth=1 --filter=blob:none --sparse --branch android11-mainline-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc32
          git -C gcc32 sparse-checkout set bin lib libexec arm-linux-androideabi

      - name: Add ReSukiSU
        run: |
          set -euo pipefail
          cd kernel_workspace/kernel
          KSU_META="${{ github.event.inputs.KSU_META }}"
          if [[ "$(grep -o '/' <<< "$KSU_META" | wc -l)" -lt 2 ]]; then
            echo "KSU_META format must be: branch/custom_tag/commit_hash" >&2
            exit 10
          fi
          IFS='/' read -r KSU_BRANCH CUSTOM_TAG MANUAL_HASH <<< "$KSU_META"
          [[ -n "$KSU_BRANCH" ]] || KSU_BRANCH="main"

          curl -LSs "https://raw.githubusercontent.com/${{ steps.manager.outputs.repo }}/${{ steps.manager.outputs.branch }}/kernel/setup.sh" | bash -s "$KSU_BRANCH"

          cd KernelSU
          if [[ -n "$MANUAL_HASH" ]]; then
            git fetch origin "$KSU_BRANCH" --depth=80
            git checkout "$MANUAL_HASH"
          fi
          KSU_VERSION=$(git rev-list --count HEAD)
          if [[ -n "$CUSTOM_TAG" ]]; then
            KSU_VERSION="${KSU_VERSION}-${CUSTOM_TAG}"
          fi
          echo "KSU_VERSION=$KSU_VERSION" >> "$GITHUB_ENV"

      - name: Apply ReSukiSU Manual Hooks
        run: |
          set -euo pipefail
          cd kernel_workspace/kernel

          python3 - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              data = p.read_text()
              for old, new in replacements:
                  if new in data:
                      continue
                  if old not in data:
                      raise SystemExit(f"missing patch anchor in {path}:\n{old}")
                  data = data.replace(old, new, 1)
              p.write_text(data)

          patch("fs/exec.c", [
              (
                  "int do_execve(struct filename *filename,\n"
                  "\tconst char __user *const __user *__argv,\n"
                  "\tconst char __user *const __user *__envp)\n",
                  "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                  "__attribute__((hot))\n"
                  "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n"
                  "\t\t\t\tvoid *argv, void *envp, int *flags);\n"
                  "#endif\n\n"
                  "int do_execve(struct filename *filename,\n"
                  "\tconst char __user *const __user *__argv,\n"
                  "\tconst char __user *const __user *__envp)\n"
              ),
              (
                  "\tstruct user_arg_ptr argv = { .ptr.native = __argv };\n"
                  "\tstruct user_arg_ptr envp = { .ptr.native = __envp };\n"
                  "\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);\n",
                  "\tstruct user_arg_ptr argv = { .ptr.native = __argv };\n"
                  "\tstruct user_arg_ptr envp = { .ptr.native = __envp };\n"
                  "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                  "\tint ksu_fd = AT_FDCWD;\n"
                  "\tint ksu_flags = 0;\n"
                  "\tksu_handle_execveat(&ksu_fd, &filename, &argv, &envp, &ksu_flags);\n"
                  "\treturn do_execveat_common(ksu_fd, filename, argv, envp, ksu_flags);\n"
                  "#endif\n"
                  "\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);\n"
              ),
              (
                  "\tstruct user_arg_ptr argv = { .ptr.native = __argv };\n"
                  "\tstruct user_arg_ptr envp = { .ptr.native = __envp };\n\n"
                  "\treturn do_execveat_common(fd, filename, argv, envp, flags);\n",
                  "\tstruct user_arg_ptr argv = { .ptr.native = __argv };\n"
                  "\tstruct user_arg_ptr envp = { .ptr.native = __envp };\n\n"
                  "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                  "\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n"
                  "#endif\n"
                  "\treturn do_execveat_common(fd, filename, argv, envp, flags);\n"
              ),
              (
                  "\tstruct user_arg_ptr envp = {\n"
                  "\t\t.is_compat = true,\n"
                  "\t\t.ptr.compat = __envp,\n"
                  "\t};\n"
                  "\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);\n",
                  "\tstruct user_arg_ptr envp = {\n"
                  "\t\t.is_compat = true,\n"
                  "\t\t.ptr.compat = __envp,\n"
                  "\t};\n"
                  "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                  "\tint ksu_fd = AT_FDCWD;\n"
                  "\tint ksu_flags = 0;\n"
                  "\tksu_handle_execveat(&ksu_fd, &filename, &argv, &envp, &ksu_flags);\n"
                  "\treturn do_execveat_common(ksu_fd, filename, argv, envp, ksu_flags);\n"
                  "#endif\n"
                  "\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);\n"
              ),
              (
                  "\tstruct user_arg_ptr envp = {\n"
                  "\t\t.is_compat = true,\n"
                  "\t\t.ptr.compat = __envp,\n"
                  "\t};\n"
                  "\treturn do_execveat_common(fd, filename, argv, envp, flags);\n",
                  "\tstruct user_arg_ptr envp = {\n"
                  "\t\t.is_compat = true,\n"
                  "\t\t.ptr.compat = __envp,\n"
                  "\t};\n"
                  "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                  "\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n"
                  "#endif\n"
                  "\treturn do_execveat_common(fd, filename, argv, envp, flags);\n"
              ),
          ])

          patch("fs/open.c", [
              (
                  "/*\n"
                  " * access() needs to use the real uid/gid, not the effective uid/gid.\n",
                  "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                  "__attribute__((hot))\n"
                  "extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n"
                  "\t\t\t\tint *mode, int *flags);\n"
                  "#endif\n\n"
                  "/*\n"
                  " * access() needs to use the real uid/gid, not the effective uid/gid.\n"
              ),
              (
                  "\tint res;\n"
                  "\tunsigned int lookup_flags = LOOKUP_FOLLOW;\n\n"
                  "\tif (mode & ~S_IRWXO)",
                  "\tint res;\n"
                  "\tunsigned int lookup_flags = LOOKUP_FOLLOW;\n\n"
                  "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                  "\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n"
                  "#endif\n"
                  "\tif (mode & ~S_IRWXO)"
              ),
          ])

          patch("kernel/reboot.c", [
              (
                  "SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,\n"
                  "\t\tvoid __user *, arg)\n",
                  "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                  "extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd,\n"
                  "\t\t\t\tvoid __user **arg);\n"
                  "#endif\n\n"
                  "SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,\n"
                  "\t\tvoid __user *, arg)\n"
              ),
              (
                  "\tchar buffer[256];\n"
                  "\tint ret = 0;\n\n"
                  "\t/* We only trust the superuser with rebooting the system. */\n",
                  "\tchar buffer[256];\n"
                  "\tint ret = 0;\n\n"
                  "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                  "\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n"
                  "#endif\n"
                  "\t/* We only trust the superuser with rebooting the system. */\n"
              ),
          ])

          patch("fs/stat.c", [
              (
                  "#if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)\n",
                  "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                  "__attribute__((hot))\n"
                  "extern int ksu_handle_stat(int *dfd, const char __user **filename_user,\n"
                  "\t\t\t\tint *flags);\n"
                  "extern void ksu_handle_newfstat_ret(unsigned int *fd,\n"
                  "\t\t\t\tstruct stat __user **statbuf_ptr);\n"
                  "#if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)\n"
                  "extern void ksu_handle_fstat64_ret(unsigned long *fd,\n"
                  "\t\t\t\tstruct stat64 __user **statbuf_ptr);\n"
                  "#endif\n"
                  "#endif\n\n"
                  "#if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)\n"
              ),
              (
                  "\tstruct kstat stat;\n"
                  "\tint error;\n\n"
                  "\terror = vfs_fstatat(dfd, filename, &stat, flag);\n",
                  "\tstruct kstat stat;\n"
                  "\tint error;\n\n"
                  "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                  "\tksu_handle_stat(&dfd, &filename, &flag);\n"
                  "#endif\n"
                  "\terror = vfs_fstatat(dfd, filename, &stat, flag);\n"
              ),
              (
                  "\tif (!error)\n"
                  "\t\terror = cp_new_stat(&stat, statbuf);\n\n"
                  "\treturn error;\n"
                  "}\n\n"
                  "SYSCALL_DEFINE4(readlinkat",
                  "\tif (!error)\n"
                  "\t\terror = cp_new_stat(&stat, statbuf);\n"
                  "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                  "\tksu_handle_newfstat_ret(&fd, &statbuf);\n"
                  "#endif\n\n"
                  "\treturn error;\n"
                  "}\n\n"
                  "SYSCALL_DEFINE4(readlinkat"
              ),
              (
                  "\tif (!error)\n"
                  "\t\terror = cp_new_stat64(&stat, statbuf);\n\n"
                  "\treturn error;\n"
                  "}\n\n"
                  "SYSCALL_DEFINE4(fstatat64",
                  "\tif (!error)\n"
                  "\t\terror = cp_new_stat64(&stat, statbuf);\n"
                  "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                  "\tksu_handle_fstat64_ret(&fd, &statbuf);\n"
                  "#endif\n\n"
                  "\treturn error;\n"
                  "}\n\n"
                  "SYSCALL_DEFINE4(fstatat64"
              ),
              (
                  "SYSCALL_DEFINE4(fstatat64, int, dfd, const char __user *, filename,\n"
                  "\t\tstruct stat64 __user *, statbuf, int, flag)\n"
                  "{\n"
                  "\tstruct kstat stat;\n"
                  "\tint error;\n\n"
                  "\terror = vfs_fstatat(dfd, filename, &stat, flag);\n",
                  "SYSCALL_DEFINE4(fstatat64, int, dfd, const char __user *, filename,\n"
                  "\t\tstruct stat64 __user *, statbuf, int, flag)\n"
                  "{\n"
                  "\tstruct kstat stat;\n"
                  "\tint error;\n\n"
                  "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
                  "\tksu_handle_stat(&dfd, &filename, &flag);\n"
                  "#endif\n"
                  "\terror = vfs_fstatat(dfd, filename, &stat, flag);\n"
              ),
          ])
          PY

          grep -q 'ksu_handle_execveat' fs/exec.c
          grep -q 'ksu_handle_faccessat' fs/open.c
          grep -q 'ksu_handle_stat' fs/stat.c
          grep -q 'ksu_handle_newfstat_ret' fs/stat.c
          grep -q 'ksu_handle_fstat64_ret' fs/stat.c
          grep -q 'ksu_handle_sys_reboot' kernel/reboot.c

      - name: Fix Xiaomi Duplicate VCU Object
        run: |
          set -euo pipefail
          cd kernel_workspace/kernel

          VCU_MAKEFILE="drivers/media/platform/mtk-vcu/Makefile"
          if grep -q 'obj-$(CONFIG_VIDEO_MEDIATEK_VCU) += mtk-vcu.o mtk_vcodec_mem.o' "$VCU_MAKEFILE"; then
            sed -i 's/obj-$(CONFIG_VIDEO_MEDIATEK_VCU) += mtk-vcu.o mtk_vcodec_mem.o/obj-$(CONFIG_VIDEO_MEDIATEK_VCU) += mtk-vcu.o/' "$VCU_MAKEFILE"
          fi
          grep -q 'obj-$(CONFIG_VIDEO_MEDIATEK_VCU) += mtk-vcu.o$' "$VCU_MAKEFILE"

      - name: Configure Kernel
        run: |
          set -euo pipefail
          cd kernel_workspace/kernel
          export PATH="$GITHUB_WORKSPACE/kernel_workspace/clang/clang-r383902/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:/usr/lib/ccache:$PATH"

          make O=out ARCH=arm64 "${{ steps.device.outputs.defconfig }}"

          ./scripts/config --file out/.config -e KSU
          ./scripts/config --file out/.config -d KSU_TRACEPOINT_HOOK
          ./scripts/config --file out/.config -e KSU_MANUAL_HOOK
          ./scripts/config --file out/.config -e SECCOMP
          ./scripts/config --file out/.config -e SECCOMP_FILTER

          if [[ "${{ github.event.inputs.BUILD_TIME }}" != "F" && "${{ github.event.inputs.BUILD_TIME }}" != "f" && -n "${{ github.event.inputs.BUILD_TIME }}" ]]; then
            echo "KBUILD_BUILD_TIMESTAMP=${{ github.event.inputs.BUILD_TIME }}" >> "$GITHUB_ENV"
          else
            echo "KBUILD_BUILD_TIMESTAMP=$(TZ=UTC date +'%a %b %d %T %Z %Y')" >> "$GITHUB_ENV"
          fi
          echo "KBUILD_BUILD_USER=builder" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_HOST=github-actions" >> "$GITHUB_ENV"

          make O=out ARCH=arm64 olddefconfig
          grep '^CONFIG_KSU=' out/.config || true
          grep '^CONFIG_SECCOMP=' out/.config || true
          grep '^CONFIG_SECCOMP_FILTER=' out/.config || true

      - name: Build Kernel
        run: |
          set -euo pipefail
          cd kernel_workspace/kernel
          export PATH="$GITHUB_WORKSPACE/kernel_workspace/clang/clang-r383902/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:/usr/lib/ccache:$PATH"
          make -j"$(nproc --all)" O=out ARCH=arm64 \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            "${{ steps.device.outputs.kernel_image }}"
          ccache -s

      - name: Save Ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache_${{ github.event.inputs.FILE }}
          key: ccache-${{ github.event.inputs.FILE }}-${{ github.run_id }}

      - name: Make AnyKernel3
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/.github

          IMAGE="kernel_workspace/kernel/out/${{ steps.device.outputs.kernel_image }}"
          if [[ ! -f "$IMAGE" ]]; then
            echo "Kernel image not found: $IMAGE" >&2
            find kernel_workspace/kernel/out/arch/arm64/boot -maxdepth 2 -type f | sort || true
            exit 20
          fi

          cp "$IMAGE" AnyKernel3/Image.gz-dtb
          sed -i 's/^do.devicecheck=.*/do.devicecheck=0/' AnyKernel3/anykernel.sh
          sed -i 's/^do.modules=.*/do.modules=0/' AnyKernel3/anykernel.sh
          sed -i 's/^is_slot_device=.*/is_slot_device=auto/' AnyKernel3/anykernel.sh

      - name: Download ReSukiSU Manager
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MANAGER_REPO="${{ steps.manager.outputs.repo }}"
          MANAGER_BRANCH="${{ steps.manager.outputs.branch }}"
          MANAGER_ARTIFACT="${{ steps.manager.outputs.artifact }}"

          run_id=$(gh api "repos/${MANAGER_REPO}/actions/workflows/build-manager.yml/runs?branch=${MANAGER_BRANCH}&status=success&per_page=1" --jq '.workflow_runs[0].id' || echo "")
          [[ -n "$run_id" ]] || exit 0

          artifact_url=$(gh api "repos/${MANAGER_REPO}/actions/runs/${run_id}/artifacts" \
            | jq -r ".artifacts[] | select(.name == \"${MANAGER_ARTIFACT}\") | .archive_download_url" \
            | head -n1)
          [[ -n "$artifact_url" ]] || exit 0

          curl -fL -H "Authorization: token ${GITHUB_TOKEN}" -o "${MANAGER_ARTIFACT}.zip" "$artifact_url"
          unzip -j "${MANAGER_ARTIFACT}.zip" "*.apk" -d AnyKernel3/ || true

      - name: Pack AnyKernel3 Zip
        id: pack
        run: |
          set -euo pipefail
          SAFE_SUFFIX="${{ github.event.inputs.SUFFIX }}"
          [[ -n "$SAFE_SUFFIX" ]] && SAFE_SUFFIX="_${SAFE_SUFFIX}"
          ZIP_NAME="AnyKernel3_ReSukiSU_${KSU_VERSION}_${{ github.event.inputs.FILE }}${SAFE_SUFFIX}.zip"
          cd AnyKernel3
          zip -r "../${ZIP_NAME}" ./*
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.zip_name }}
          path: ./${{ steps.pack.outputs.zip_name }}
