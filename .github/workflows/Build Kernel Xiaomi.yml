      - name: Fix Xiaomi Duplicate VCU Object
        run: |
          set -euo pipefail
          cd kernel_workspace/kernel

          if [[ "${{ github.event.inputs.FILE }}" == "redmi_10x5g_atom_r" ]]; then
            FTS_FW_DIR="drivers/input/touchscreen/focaltech_touch/include/firmware"
            FTS_PB_DIR="drivers/input/touchscreen/focaltech_touch/include/pramboot"
            FTS_BASE="https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/cannon-q-oss/drivers/input/touchscreen/focaltech_touch"
            mkdir -p "$FTS_FW_DIR" "$FTS_PB_DIR"

            fetch_fts_file() {
              local url="$1"
              local dest="$2"
              local expected_size="$3"
              local expected_sha256="$4"
              local tmp="${dest}.tmp"

              curl -LfsS "$url" -o "$tmp"
              local actual_size
              actual_size="$(wc -c < "$tmp" | tr -d '[:space:]')"
              if [[ "$actual_size" != "$expected_size" ]]; then
                echo "Unexpected size for $dest: got $actual_size, want $expected_size" >&2
                exit 31
              fi
              echo "${expected_sha256}  ${tmp}" | sha256sum -c -
              mv "$tmp" "$dest"
            }

            # bomb-q-oss has the same FocalTech driver sources as cannon-q-oss, but misses these include blobs.
            fetch_fts_file "$FTS_BASE/include/firmware/fw_ft3518_j7.i" \
              "$FTS_FW_DIR/fw_ft3518_j7.i" \
              "279409" \
              "c063733f44d1cdef4d3df9d5168c63b21f609b1297dfb7c1cdb9e2456da646b2"
            fetch_fts_file "$FTS_BASE/include/firmware/fw_sample.i" \
              "$FTS_FW_DIR/fw_sample.i" \
              "0" \
              "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
            fetch_fts_file "$FTS_BASE/include/pramboot/FT8719_Pramboot_V0.5_20171221.i" \
              "$FTS_PB_DIR/FT8719_Pramboot_V0.5_20171221.i" \
              "17347" \
              "2a1513c55730ec453846f10b0c93ecd0bf7af737b408a11e7025f6b4dac685f4"
          fi

          VCU_MAKEFILE="drivers/media/platform/mtk-vcu/Makefile"
          if grep -q 'obj-$(CONFIG_VIDEO_MEDIATEK_VCU) += mtk-vcu.o mtk_vcodec_mem.o' "$VCU_MAKEFILE"; then
            sed -i 's/obj-$(CONFIG_VIDEO_MEDIATEK_VCU) += mtk-vcu.o mtk_vcodec_mem.o/obj-$(CONFIG_VIDEO_MEDIATEK_VCU) += mtk-vcu.o/' "$VCU_MAKEFILE"
          fi
          grep -q 'obj-$(CONFIG_VIDEO_MEDIATEK_VCU) += mtk-vcu.o$' "$VCU_MAKEFILE"

      - name: Configure Kernel
        run: |
          set -euo pipefail
          cd kernel_workspace/kernel
          export PATH="$GITHUB_WORKSPACE/kernel_workspace/clang/clang-r383902/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:/usr/lib/ccache:$PATH"

          make O=out ARCH=arm64 "${{ steps.device.outputs.defconfig }}"

          ./scripts/config --file out/.config -e KSU
          ./scripts/config --file out/.config -d KSU_TRACEPOINT_HOOK
          if [[ "${{ github.event.inputs.ENABLE_SUSFS }}" == "true" && "${{ github.event.inputs.SUSFS_META }}" != "-1" ]]; then
            ./scripts/config --file out/.config -d KSU_MANUAL_HOOK
            ./scripts/config --file out/.config -e KSU_SUSFS
            ./scripts/config --file out/.config -e KSU_SUSFS_SUS_PATH
            ./scripts/config --file out/.config -e KSU_SUSFS_SUS_MOUNT
            ./scripts/config --file out/.config -e KSU_SUSFS_SUS_KSTAT
            ./scripts/config --file out/.config -e KSU_SUSFS_SPOOF_UNAME
            ./scripts/config --file out/.config -e KSU_SUSFS_ENABLE_LOG
            ./scripts/config --file out/.config -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            ./scripts/config --file out/.config -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            ./scripts/config --file out/.config -e KSU_SUSFS_OPEN_REDIRECT
          else
            ./scripts/config --file out/.config -e KSU_MANUAL_HOOK
            ./scripts/config --file out/.config -d KSU_SUSFS
          fi
          if [[ "${{ github.event.inputs.ENABLE_KPM }}" == "true" ]]; then
            ./scripts/config --file out/.config -e KPM
            ./scripts/config --file out/.config -e KALLSYMS
            ./scripts/config --file out/.config -e KALLSYMS_ALL
          else
            ./scripts/config --file out/.config -d KPM
          fi
          ./scripts/config --file out/.config -e SECCOMP
          ./scripts/config --file out/.config -e SECCOMP_FILTER

          if [[ "${{ github.event.inputs.BUILD_TIME }}" != "F" && "${{ github.event.inputs.BUILD_TIME }}" != "f" && -n "${{ github.event.inputs.BUILD_TIME }}" ]]; then
            echo "KBUILD_BUILD_TIMESTAMP=${{ github.event.inputs.BUILD_TIME }}" >> "$GITHUB_ENV"
          else
            echo "KBUILD_BUILD_TIMESTAMP=$(TZ=UTC date +'%a %b %d %T %Z %Y')" >> "$GITHUB_ENV"
          fi
          echo "KBUILD_BUILD_USER=builder" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_HOST=github-actions" >> "$GITHUB_ENV"

          make O=out ARCH=arm64 olddefconfig
          grep '^CONFIG_KSU=' out/.config || true
          grep '^CONFIG_KPM=' out/.config || true
          grep '^CONFIG_KALLSYMS=' out/.config || true
          grep '^CONFIG_KALLSYMS_ALL=' out/.config || true
          grep '^CONFIG_KSU_MANUAL_HOOK=' out/.config || true
          grep '^CONFIG_KSU_SUSFS=' out/.config || true
          grep '^CONFIG_SECCOMP=' out/.config || true
          grep '^CONFIG_SECCOMP_FILTER=' out/.config || true

      - name: Build Kernel
        run: |
          set -euo pipefail
          cd kernel_workspace/kernel
          export PATH="$GITHUB_WORKSPACE/kernel_workspace/clang/clang-r383902/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:/usr/lib/ccache:$PATH"
          make -j4 O=out ARCH=arm64 \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            "${{ steps.device.outputs.build_target }}"
          ccache -s

      - name: Save Ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache_${{ github.event.inputs.FILE }}
          key: ccache-${{ github.event.inputs.FILE }}-${{ github.run_id }}

      - name: Make AnyKernel3
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/.github

          IMAGE="kernel_workspace/kernel/out/${{ steps.device.outputs.kernel_image }}"
          if [[ ! -f "$IMAGE" ]]; then
            echo "Kernel image not found: $IMAGE" >&2
            find kernel_workspace/kernel/out/arch/arm64/boot -maxdepth 2 -type f | sort || true
            exit 20
          fi

          cp "$IMAGE" AnyKernel3/Image.gz-dtb
          sed -i 's/^do.devicecheck=.*/do.devicecheck=0/' AnyKernel3/anykernel.sh
          sed -i 's/^do.modules=.*/do.modules=0/' AnyKernel3/anykernel.sh
          sed -i 's/^is_slot_device=.*/is_slot_device=auto/' AnyKernel3/anykernel.sh

      - name: Download ReSukiSU Manager
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MANAGER_REPO="${{ steps.manager.outputs.repo }}"
          MANAGER_BRANCH="${{ steps.manager.outputs.branch }}"
          MANAGER_ARTIFACT="${{ steps.manager.outputs.artifact }}"

          run_id=$(gh api "repos/${MANAGER_REPO}/actions/workflows/build-manager.yml/runs?branch=${MANAGER_BRANCH}&status=success&per_page=1" --jq '.workflow_runs[0].id' || echo "")
          [[ -n "$run_id" ]] || exit 0

          artifact_url=$(gh api "repos/${MANAGER_REPO}/actions/runs/${run_id}/artifacts" \
            | jq -r ".artifacts[] | select(.name == \"${MANAGER_ARTIFACT}\") | .archive_download_url" \
            | head -n1)
          [[ -n "$artifact_url" ]] || exit 0

          curl -fL -H "Authorization: token ${GITHUB_TOKEN}" -o "${MANAGER_ARTIFACT}.zip" "$artifact_url"
          unzip -j "${MANAGER_ARTIFACT}.zip" "*.apk" -d AnyKernel3/ || true

      - name: Pack AnyKernel3 Zip
        id: pack
        run: |
          set -euo pipefail
          SAFE_SUFFIX="${{ github.event.inputs.SUFFIX }}"
          [[ -n "$SAFE_SUFFIX" ]] && SAFE_SUFFIX="_${SAFE_SUFFIX}"
          ZIP_NAME="AnyKernel3_ReSukiSU_${KSU_VERSION}_${{ github.event.inputs.FILE }}${SAFE_SUFFIX}.zip"
          cd AnyKernel3
          zip -r "../${ZIP_NAME}" ./*
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.zip_name }}
          path: ./${{ steps.pack.outputs.zip_name }}
